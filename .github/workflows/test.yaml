name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install httpx==0.28.1 rich==15.0.0
      - run: python -m unittest discover -s tests -v
      - name: Page script syntax
        run: |
          for page in index compat; do
            python -c "import re,sys; s=open(f'webui/{sys.argv[1]}.html').read(); open('/tmp/ui.js','w').write(re.search(r'<script>(.*)</script>', s, re.S).group(1))" $page
            node --check /tmp/ui.js
          done
      - name: Docker build
        run: docker build -t jfstress-ui .
